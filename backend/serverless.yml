org: jviry
app: diary-app  # Choose your app name
service: diary-app

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-1

build:
  esbuild:
    bundle: false

package:
  individually: true
  patterns:
    - 'dist/**'
    # Drop alternative operating system binaries to save space
    - '!node_modules/.prisma/client/query-engine-*'
    - 'node_modules/.prisma/client/query-engine-rhel-*'
    - '!node_modules/prisma/query-engine-*'
    - '!node_modules/prisma/**'
    - '!**/*.map'

functions:
  auth:
    handler: dist/handlers/auth.handler
    events:
      - httpApi:
          path: /auth/{proxy+}
          method: ANY

  letters:
    handler: dist/handlers/letters.handler
    events:
      - httpApi:
          path: /letters/{proxy+}
          method: ANY
